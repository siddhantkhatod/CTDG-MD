[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctdg-md"
version = "2.0.0"
description = "Equivariant continuous-time dynamic graphs with temporal virtual nodes for protein-ligand MD"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CTDG-MD project"}]
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "h5py>=3.10",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
ctdg-md = "ctdg_md.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data", "outputs"]
